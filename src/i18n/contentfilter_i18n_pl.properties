system_property.plugin.contentFilter.allow.on.match=Jeśli wyłączone, pakiety zawierające treść pasującą do zdefiniowanych wyrażeń regularnych będą odrzucane. Jeśli włączone - pakiety zostaną dopuszczone i opcjonalnie zamaskowane.
system_property.plugin.contentFilter.filter.status.enabled=Jeśli włączone, pakiety będą filtrowane.
system_property.plugin.contentFilter.mask=Jeśli właściwość zostanie ustawiona, wszelkie pasujące treści nie zostaną odrzucone, lecz zamaskowane podaną wartością. Ustawienie maski treści sprawia, że właściwość „plugin.contentFilter.rejection.notification.enabled” będzie ignorowana.
system_property.plugin.contentFilter.mask.enabled=Jeśli włączone, wartość „plugin.contentFilter.mask” zostanie użyta do zamaskowania pasującej treści.
system_property.plugin.contentFilter.patterns=Rozdzielona przecinkami lista wyrażeń regularnych, według których filtrowana będzie treść użytkowników
system_property.plugin.contentFilter.patterns.enabled=Jeśli włączone, wartość „plugin.contentFilter.patterns” zostanie użyta do dopasowywania wzorców.
system_property.plugin.contentFilter.rejection.msg=Treść wiadomości wysyłanej do użytkownika w celu powiadomienia go o odrzuceniu pakietu - jeśli powiadomienia o odrzuceniu są włączone.
system_property.plugin.contentFilter.rejection.notification.enabled=Jeśli włączone, nadawca zostanie powiadomiony o odrzuceniu wiadomości. W przeciwnym wypadku wiadomość zostanie odrzucona 'po cichu' i tzn. nadawca nie dowie się o jej odrzuceniu, a odbiorca jej nie otrzyma.
system_property.plugin.contentFilter.violation.notification.by.email.enabled=Jeśli włączone - true, użytkownik zidentyfikowany przez wartość właściwości #VIOLATION_NOTIFICATION_CONTACT_PROPERTY otrzyma powiadomienie e-mail.
system_property.plugin.contentFilter.violation.notification.by.im.enabled=Jeśli włączone, użytkownik zidentyfikowany przez wartość właściwości „plugin.contentFilter.violation.notification.contact” otrzyma powiadomienie przez komunikator.
system_property.plugin.contentFilter.violation.notification.contact=Nazwa lokalnego użytkownika, który będzie powiadamiany o naruszeniach polityki filtrowania zawartości.
system_property.plugin.contentFilter.violation.notification.enabled=Jeśli włączone, użytkownik zidentyfikowany przez wartość właściwości „plugin.contentFilter.violation.notification.contact” będzie powiadamiany za każdym razem, gdy treść pasuje do wzorca. W przeciwnym razie powiadomienia nie będą wysyłane.
system_property.plugin.contentFilter.violation.notification.include.original.enabled=Jeśli włączone, użytkownik zidentyfikowany przez wartość właściwości „plugin.contentFilter.violation.notification.contact” otrzyma kopię pakietu, który spowodował naruszenie.
